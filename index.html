
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Feedback Manager</h1>
    <p>We value your feedback!</p>

    <form id="feedbackForm">

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Rating</label>
        <input type="number" id="rating" min="1" max="5" placeholder="Rate from 1 to 5" required>

        <label>Comment</label>
        <textarea id="comment" placeholder="Write your feedback" required></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <script src="script.js"></script>
</body>
</html>
